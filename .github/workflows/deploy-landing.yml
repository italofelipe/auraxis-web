name: Deploy Landing (auraxis.com.br)

# Public capture landing (issue #1165) — dedicated static build of the
# `landing` surface, shipped to its own S3 bucket + CloudFront distribution
# on the apex domain. Infra (bucket, distribution, OIDC role) is provisioned
# separately (platform#911); until the repository vars below exist, the deploy
# job self-skips with a ::notice (same capability-check pattern as the
# auraxis-api-v2 deploy-dev job):
#
#   vars.AWS_ROLE_ARN_LANDING             — OIDC role for the landing deploy
#   vars.AURAXIS_LANDING_BUCKET           — S3 bucket for auraxis.com.br
#   vars.AURAXIS_LANDING_DISTRIBUTION_ID  — CloudFront distribution to invalidate

on:
  push:
    branches: [main]
    # Lista de EXCLUSÃO, não de inclusão (#1197).
    #
    # A allowlist anterior tentava enumerar o que a landing embarca e, na
    # prática, sempre ficava desatualizada: quando o checkout próprio entrou
    # (#1187), `app/pages/checkout/**` ficou de fora e o fix de pagamento do
    # #1200 foi para a main sem nunca chegar em produção — silenciosamente,
    # sem erro nenhum. Três deploys deste dia dependeram de dispatch manual.
    #
    # O grafo real de imports da landing passa por `core/http`, `composables/*`,
    # `features/subscription`, `schemas/*` e cresce a cada feature; manter isso
    # sincronizado à mão é garantia de repetir o bug. Invertendo, o pior caso
    # vira um deploy à toa em vez de uma mudança que não sobe.
    #
    # Custo do pior caso: repositório público → minutos de Actions ilimitados;
    # a invalidação usa `--paths "/*"`, que conta como 1 path, contra 1.000
    # gratuitos por mês na AWS. No ritmo atual (unidades de push por dia) fica
    # dentro do free tier com folga.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".context/**"
      - ".vscode/**"
      - ".idea/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: landing-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "25"
  PNPM_VERSION: "10.30.1"
  AWS_REGION: "us-east-1"

jobs:
  # ── 1. Generate the landing static artifact + e2e gate ─────────────────────
  build:
    name: Generate landing static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate landing static site
        env:
          NODE_ENV: production
          NUXT_PUBLIC_SITE_SURFACE: landing
          NUXT_PUBLIC_SITE_URL: https://auraxis.com.br
          NUXT_PUBLIC_APP_ENV: production
          NUXT_PUBLIC_API_BASE: https://api.auraxis.com.br
          NUXT_PUBLIC_API_V2_BASE: https://v2.auraxis.com.br
          NUXT_PUBLIC_BUILD_ID: "${{ github.run_id }}-${{ github.sha }}"
          # Error monitoring on the apex landing. Active as soon as this ships:
          # the DSN secret already exists and Sentry is not consent-gated.
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          # PostHog product analytics — mirrors deploy.yml (#1125). Both
          # prerequisites are met since #1177: the shared secret exists and the
          # LGPD banner renders on the landing (analytics is opt-in). The
          # project lives in PostHog Cloud US, so the ingest host must override
          # the EU default baked into nuxt.config runtimeConfig.
          NUXT_PUBLIC_POSTHOG_API_KEY: ${{ secrets.NUXT_PUBLIC_POSTHOG_API_KEY }}
          NUXT_PUBLIC_POSTHOG_API_HOST: https://us.i.posthog.com
        run: pnpm generate

      - name: Validate output
        run: |
          test -d .output/public || (echo "ERROR: .output/public not found"; exit 1)
          test -f .output/public/index.html || (echo "ERROR: index.html not found"; exit 1)
          grep -q "landing-hero" .output/public/index.html \
            || (echo "ERROR: landing hero markup missing from index.html — wrong surface built?"; exit 1)
          # Conteúdo público migrado (#1211) — sem estes arquivos os 301 do app
          # (platform#934) apontariam para o vazio.
          test -f .output/public/tools/index.html \
            || (echo "ERROR: /tools index missing — content expansion not built"; exit 1)
          test -f .output/public/tools/juros-compostos/index.html \
            || (echo "ERROR: sample tool page missing"; exit 1)
          test -f .output/public/controle-financeiro/index.html \
            || (echo "ERROR: sample SEO landing missing"; exit 1)
          test -f .output/public/blog/index.html \
            || (echo "ERROR: blog index missing"; exit 1)
          grep -q "tools/juros-compostos" .output/public/sitemap.xml \
            || (echo "ERROR: sitemap.xml does not list tool routes"; exit 1)
          echo "✓ Landing static output validated"
          echo "  Files: $(find .output/public -type f | wc -l)"
          echo "  Size:  $(du -sh .output/public | cut -f1)"

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E gate — landing surface
        env:
          LANDING_E2E: "1"
          # Lets the spec assert real ingestion after consent (#1177): the
          # assertion only runs when the build was baked with a key.
          NUXT_PUBLIC_POSTHOG_API_KEY: ${{ secrets.NUXT_PUBLIC_POSTHOG_API_KEY }}
        run: pnpm test:e2e e2e/landing.spec.ts --project=chromium

      - name: Package static output
        # .output is in .gitignore — package as tarball so upload-artifact
        # does not skip it via gitignore-aware globbing.
        run: tar -czf landing-build.tar.gz .output/public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-static
          path: landing-build.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ── 2. Deploy to S3 + invalidate CloudFront (self-skips until infra) ───────
  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check deploy capability
        id: cap
        env:
          AWS_ROLE_ARN_LANDING: ${{ vars.AWS_ROLE_ARN_LANDING }}
          LANDING_BUCKET: ${{ vars.AURAXIS_LANDING_BUCKET }}
          LANDING_DISTRIBUTION_ID: ${{ vars.AURAXIS_LANDING_DISTRIBUTION_ID }}
        run: |
          missing=""
          [ -n "${AWS_ROLE_ARN_LANDING:-}" ] || missing="${missing} AWS_ROLE_ARN_LANDING"
          [ -n "${LANDING_BUCKET:-}" ] || missing="${missing} AURAXIS_LANDING_BUCKET"
          [ -n "${LANDING_DISTRIBUTION_ID:-}" ] || missing="${missing} AURAXIS_LANDING_DISTRIBUTION_ID"
          if [ -n "${missing}" ]; then
            echo "::notice::Landing deploy skipped — missing repository vars:${missing} (infra pending, platform#911)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: steps.cap.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: landing-static
          path: .

      - name: Extract static output
        if: steps.cap.outputs.enabled == 'true'
        run: tar -xzf landing-build.tar.gz

      - name: Configure AWS credentials (OIDC)
        if: steps.cap.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_LANDING }}
          aws-region: ${{ env.AWS_REGION }}

      # HTML first with no-cache (aws s3 sync skips ETag-identical files which
      # can strand stale HTML — cp always overwrites), hashed assets after with
      # immutable cache, then a full sync --delete to drop obsolete chunks.
      - name: Upload HTML files (no-cache, force)
        if: steps.cap.outputs.enabled == 'true'
        run: |
          aws s3 cp .output/public/ "s3://${{ vars.AURAXIS_LANDING_BUCKET }}/" \
            --region "${{ env.AWS_REGION }}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Sync remaining assets (immutable cache + delete stale)
        if: steps.cap.outputs.enabled == 'true'
        run: |
          aws s3 sync .output/public/ "s3://${{ vars.AURAXIS_LANDING_BUCKET }}/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        if: steps.cap.outputs.enabled == 'true'
        run: |
          DIST_ID="${{ vars.AURAXIS_LANDING_DISTRIBUTION_ID }}"
          echo "Invalidating CloudFront distribution: $DIST_ID"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✓ Invalidation created: $INVALIDATION_ID"
          echo "INVALIDATION_ID=$INVALIDATION_ID" >> "$GITHUB_ENV"

      - name: Wait for invalidation to complete
        if: steps.cap.outputs.enabled == 'true'
        run: |
          echo "Waiting for CloudFront invalidation ${{ env.INVALIDATION_ID }}..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.AURAXIS_LANDING_DISTRIBUTION_ID }}" \
            --id "${{ env.INVALIDATION_ID }}"
          echo "✓ CloudFront cache invalidated"

      # ── Smoke test ──────────────────────────────────────────────────────────
      # Portado do deploy.yml do app (#1213). Duas fases, porque a primeira
      # sozinha não prova nada aqui: o CloudFront devolve 200 de fallback, então
      # status HTTP responde "o CDN está de pé", não "o meu build está no ar".
      # Já houve deploy silenciosamente ausente (#1197).
      #
      # A fase 2 compara o `x-build-id` gravado neste build com o servido. Ele é
      # embutido em toda página via <meta name="x-build-id"> (NUXT_PUBLIC_BUILD_ID).
      - name: Smoke test (HTTP + build id)
        if: steps.cap.outputs.enabled == 'true'
        env:
          SITE_HOST: auraxis.com.br
        run: |
          EXPECTED_BUILD_ID="${{ github.run_id }}-${{ github.sha }}"
          echo "Smoke test → https://${SITE_HOST}/"
          echo "Expected buildId: $EXPECTED_BUILD_ID"

          # Fase 1 — a home responde 200 com corpo
          HTTP_CODE=""
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl --silent --output /tmp/smoke.html \
              --write-out "%{http_code}" --location "https://${SITE_HOST}/")
            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/smoke.html ]; then
              echo "✓ Fase 1 — HTTP $HTTP_CODE ($(wc -c < /tmp/smoke.html) bytes)"
              break
            fi
            echo "  Tentativa $i/10 — HTTP $HTTP_CODE — nova tentativa em 3s..."
            sleep 3
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ Fase 1 falhou — home inacessível após 10 tentativas"
            exit 1
          fi

          # Fase 2 — o conteúdo servido é ESTE build.
          # O HTML vem minificado (todas as <meta> numa linha), então a âncora
          # inclui name="x-build-id" — casar só por content="..." pegaria o
          # atributo de qualquer outra meta da mesma linha.
          for i in $(seq 1 15); do
            SERVED_BUILD_ID=$(curl --silent "https://${SITE_HOST}/" \
              | grep -o 'name="x-build-id" content="[^"]*"' \
              | cut -d'"' -f4)
            if [ "$SERVED_BUILD_ID" = "$EXPECTED_BUILD_ID" ]; then
              echo "✓ Fase 2 — buildId confirmado: $SERVED_BUILD_ID"
              exit 0
            fi
            echo "  Tentativa $i/15 — servido=$SERVED_BUILD_ID esperado=$EXPECTED_BUILD_ID — 5s..."
            sleep 5
          done
          echo "✗ Fase 2 falhou — CloudFront ainda serve build antigo após 75s"
          echo "  servido:   $SERVED_BUILD_ID"
          echo "  esperado:  $EXPECTED_BUILD_ID"
          exit 1

      # O sitemap é o que sustenta a indexação do apex (72 URLs hoje). Ele já
      # teve DOIS donos disputando o mesmo caminho — o `nitro.prerender` servia
      # um diretório com redirect HTML enquanto o @nuxtjs/sitemap servia o XML,
      # e o vencedor variava por build (#1233). Um deploy que devolva HTML aqui
      # é regressão de SEO invisível: o Search Console só reclama dias depois.
      - name: Validate published sitemap
        if: steps.cap.outputs.enabled == 'true'
        env:
          SITE_HOST: auraxis.com.br
          MIN_URLS: 60
        run: |
          CONTENT_TYPE=$(curl --silent --output /tmp/sitemap.xml \
            --write-out "%{content_type}" "https://${SITE_HOST}/sitemap.xml")
          echo "content-type: $CONTENT_TYPE"

          case "$CONTENT_TYPE" in
            *xml*) echo "✓ content-type é XML" ;;
            *)
              echo "✗ /sitemap.xml devolveu '$CONTENT_TYPE' — esperado XML."
              echo "  Sintoma clássico do fallback SPA servindo HTML no lugar do sitemap."
              head -c 300 /tmp/sitemap.xml
              exit 1
              ;;
          esac

          LOC_COUNT=$(grep -o '<loc>' /tmp/sitemap.xml | wc -l | tr -d ' ')
          echo "URLs no sitemap: $LOC_COUNT (mínimo $MIN_URLS)"
          if [ "$LOC_COUNT" -lt "$MIN_URLS" ]; then
            echo "✗ Sitemap encolheu — provável regressão de exclusão de rotas por surface."
            exit 1
          fi
          echo "✓ Sitemap validado"

      # Avisa Bing e parceiros (Seznam, Naver, Yandex) que as URLs mudaram —
      # protocolo aberto, sem conta nem credencial: a posse do domínio é
      # provada pelo arquivo public/<key>.txt. O Google não usa IndexNow.
      # Best-effort: falha aqui não reprova o deploy, que já subiu. (#1227)
      - name: Ping IndexNow (Bing e parceiros)
        if: steps.cap.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SITE_HOST: auraxis.com.br
        run: |
          # A chave do IndexNow é o próprio nome do arquivo publicado em
          # public/<key>.txt — derivar dali evita duplicá-la aqui (e um valor
          # de alta entropia no YAML dispara o secret scanner, embora esta
          # chave seja pública por definição do protocolo).
          KEY_FILE=$(find .output/public -maxdepth 1 -name '*.txt' ! -name 'robots.txt' | head -1)
          if [ -z "${KEY_FILE}" ]; then
            echo "::warning::arquivo de chave IndexNow ausente — ping não enviado"
            exit 0
          fi
          INDEXNOW_KEY=$(basename "${KEY_FILE}" .txt)
          # Coleta os <loc> de todo urlset do artefato (o índice de sitemaps
          # fica de fora — seus <loc> apontam para sitemaps, não para páginas)
          # e mantém apenas URLs do próprio host, para nenhum resíduo de outra
          # surface escapar para o ping.
          URLS=$(find .output/public -name '*.xml' -type f -exec grep -l '<urlset' {} + \
            | xargs grep -ohE '<loc>[^<]+</loc>' \
            | sed -e 's|<loc>||' -e 's|</loc>||' \
            | grep -E "^https://${SITE_HOST}/" \
            | sort -u \
            | head -c 100000 \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          COUNT=$(echo "${URLS}" | jq 'length')
          if [ "${COUNT}" = "0" ]; then
            echo "::warning::sitemap.xml sem URLs — IndexNow não foi chamado"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg host "${SITE_HOST}" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://${SITE_HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urlList "${URLS}" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          STATUS=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "${PAYLOAD}")
          echo "IndexNow: HTTP ${STATUS} para ${COUNT} URLs"
          cat /tmp/indexnow-response.txt || true
          case "${STATUS}" in
            200|202) echo "✓ URLs enviadas ao IndexNow" ;;
            *) echo "::warning::IndexNow respondeu ${STATUS} — deploy segue válido" ;;
          esac
